<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Réservation — Halo Braids</title>
  <meta name="description" content="Réservez votre séance de tressage en ligne. Choisissez votre service, styliste et créneau horaire — Halo Braids Ottawa."/>
  <meta name="theme-color" content="#0c0806"/>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Cinzel:wght@400;500;600&family=Great+Vibes&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body data-page="booking">

<nav class="nav solid" id="app-nav"></nav>

<section class="banner">
  <div class="banner-bg"></div>
  <div class="banner-content">
    <h1 data-i18n="booking.banner"></h1>
    <div class="h-script" data-i18n="booking.subtitle"></div>
  </div>
</section>

<section class="section section-light">

  <!-- Steps navigation -->
  <div class="steps-nav">
    <div class="step active" data-step="1">
      <div class="step-num">1</div>
      <div class="step-label" data-i18n="booking.step1"></div>
    </div>
    <div class="step" data-step="2">
      <div class="step-num">2</div>
      <div class="step-label" data-i18n="booking.step2"></div>
    </div>
    <div class="step" data-step="3">
      <div class="step-num">3</div>
      <div class="step-label" data-i18n="booking.step3"></div>
    </div>
    <div class="step" data-step="4">
      <div class="step-num">4</div>
      <div class="step-label" data-i18n="booking.step4"></div>
    </div>
  </div>

  <!-- STEP 1 : SERVICE -->
  <div class="step-content active" data-content="1">
    <div class="section-header fade-up">
      <span class="label" data-i18n="booking.step1"></span>
      <h2 class="h-serif" data-i18n="booking.chooseService"></h2>
    </div>
    <div class="grid-3" id="step1-services"></div>
    <div class="step-actions">
      <span></span>
      <button class="btn" id="btn-next-1" disabled style="opacity:.4;pointer-events:none" data-i18n="booking.next"></button>
    </div>
  </div>

  <!-- STEP 2 : STYLIST -->
  <div class="step-content" data-content="2">
    <div class="section-header fade-up">
      <span class="label" data-i18n="booking.step2"></span>
      <h2 class="h-serif" data-i18n="booking.chooseStylist"></h2>
    </div>
    <div class="grid-3" id="step2-stylists"></div>
    <div class="step-actions">
      <button class="btn btn-outline" data-prev="2" data-i18n="booking.back"></button>
      <button class="btn" id="btn-next-2" disabled style="opacity:.4;pointer-events:none" data-i18n="booking.next"></button>
    </div>
  </div>

  <!-- STEP 3 : DATE & TIME -->
  <div class="step-content" data-content="3">
    <div class="section-header fade-up">
      <span class="label" data-i18n="booking.step3"></span>
      <h2 class="h-serif" data-i18n="booking.chooseDateTime"></h2>
    </div>
    <div class="step3-layout">
      <div class="step3-cal">
        <div class="cal" id="calendar"></div>
      </div>
      <div class="step3-slots">
        <h3 class="label" id="slots-title" style="margin-bottom:1.2rem;min-height:1.2em"></h3>
        <div id="slots-container">
          <p class="empty" data-i18n="booking.selectDate"></p>
        </div>
      </div>
    </div>
    <div class="step-actions">
      <button class="btn btn-outline" data-prev="3" data-i18n="booking.back"></button>
      <button class="btn" id="btn-next-3" disabled style="opacity:.4;pointer-events:none" data-i18n="booking.next"></button>
    </div>
  </div>

  <!-- STEP 4 : CONFIRMATION -->
  <div class="step-content" data-content="4">
    <div class="section-header fade-up">
      <span class="label" data-i18n="booking.step4"></span>
      <h2 class="h-serif" data-i18n="booking.summary"></h2>
    </div>

    <div class="summary" id="summary"></div>

    <!-- Payment card -->
    <div id="payment-card" style="max-width:600px;margin:1.5rem auto 0"></div>

    <!-- Guest form (shown when not logged in) -->
    <div id="guest-section" class="guest-section hidden" style="max-width:600px;margin:1.5rem auto 0">
      <div class="guest-section-title">
        <span style="font-size:1.1rem">👤</span>
        <span data-i18n="booking.guestTitle"></span>
      </div>
      <p class="guest-section-sub" data-i18n="booking.guestSubtitle"></p>
      <div class="guest-grid">
        <div>
          <label data-i18n="booking.guestFirstname"></label>
          <input type="text" id="g-firstname" autocomplete="given-name" oninput="Booking._updateGuestConfirmBtn()"/>
        </div>
        <div>
          <label data-i18n="booking.guestLastname"></label>
          <input type="text" id="g-lastname" autocomplete="family-name"/>
        </div>
      </div>
      <div class="guest-grid" style="margin-top:.7rem">
        <div>
          <label data-i18n="booking.guestPhone"></label>
          <input type="tel" id="g-phone" autocomplete="tel" placeholder="+1 (613)" oninput="Booking._updateGuestConfirmBtn()"/>
        </div>
        <div>
          <label data-i18n="booking.guestEmail"></label>
          <input type="email" id="g-email" autocomplete="email" placeholder="email@..."/>
        </div>
      </div>
      <p class="guest-section-or">
        <span data-i18n="booking.orLogin"></span>
        <a href="account.html?redirect=booking" data-i18n="booking.loginLink"></a>
      </p>
    </div>

    <div id="auth-needed" class="hidden"></div>

    <div style="max-width:600px;margin:1.5rem auto 0">
      <label data-i18n="booking.note" style="display:block;font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.2em;color:var(--muted);margin-bottom:.4rem"></label>
      <textarea id="booking-note" class="form" style="width:100%;background:#fff;border:1px solid var(--border);padding:.85rem;font-family:'Cormorant Garamond',serif;font-size:1rem;outline:none" rows="3"></textarea>
    </div>

    <div class="step-actions">
      <button class="btn btn-outline" data-prev="4" data-i18n="booking.back"></button>
      <button class="btn btn-dark" id="btn-confirm" data-i18n="booking.confirm"></button>
    </div>
  </div>

  <!-- SUCCESS -->
  <div class="step-content" data-content="5">
    <div class="confirm-wrap">
      <!-- Checkmark -->
      <div class="confirm-check">✓</div>
      <div class="h-script" style="font-size:3rem" data-i18n="booking.success"></div>
      <p class="confirm-desc" data-i18n="booking.confirmNote"></p>

      <!-- Mini receipt -->
      <div id="confirm-mini-summary"></div>

      <!-- Action buttons -->
      <div class="confirm-actions">
        <a id="btn-email-confirm" href="#" class="btn btn-dark" target="_blank">
          📧 <span data-i18n="booking.sendEmail"></span>
        </a>
        <a id="btn-sms-confirm" href="#" class="btn btn-outline">
          💬 <span data-i18n="booking.sendSms"></span>
        </a>
        <button id="btn-invoice" class="btn btn-outline">
          🧾 <span data-i18n="booking.printInvoice"></span>
        </button>
        <button id="btn-add-cal" class="btn btn-outline">
          📅 <span data-i18n="booking.addCalendar"></span>
        </button>
      </div>

      <!-- Reminders -->
      <div class="confirm-reminders">
        <div class="reminder-item">
          <span>⚠️</span>
          <span data-i18n="booking.policyText"></span>
        </div>
        <div class="reminder-item">
          <span>💆</span>
          <span data-i18n="booking.hairPrepText"></span>
        </div>
        <div class="reminder-item">
          <span>📍</span>
          <span>Ottawa, ON &amp; Gatineau, QC · hello@halobraids.ca</span>
        </div>
      </div>

      <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:2rem">
        <a href="mes-commandes.html" id="btn-view-orders" class="btn btn-dark btn-lg" data-i18n="booking.viewOrders"></a>
        <a href="dashboard.html" class="btn btn-outline btn-lg" data-i18n="booking.viewDash"></a>
      </div>
    </div>
  </div>

</section>

<footer class="footer" id="app-footer"></footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/booking.js"></script>
<script src="assets/luxury.js"></script>
</body>
</html>
