<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Contact — Halo Braids</title>
  <meta name="description" content="Contactez Halo Braids Ottawa-Gatineau. Questions, réservations, partenariats — studio de tressage de luxe."/>
  <meta name="theme-color" content="#0c0806"/>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Cinzel:wght@400;500;600&family=Great+Vibes&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body data-page="contact">

<nav class="nav solid" id="app-nav"></nav>

<section class="banner">
  <div class="banner-bg"></div>
  <div class="banner-content">
    <h1 data-i18n="contact.banner"></h1>
    <div class="h-script" data-i18n="contact.subtitle"></div>
  </div>
</section>

<!-- INFO + FORM -->
<section class="section section-light">
  <div class="contact-grid">

    <!-- Left : info -->
    <div class="fade-up">
      <span class="label" data-i18n="contact.label"></span>
      <div class="h-script" style="font-size:clamp(2.2rem,4vw,3.5rem);margin:.4rem 0" data-i18n="contact.title"></div>

      <div class="contact-infos">
        <div class="contact-info-row">
          <span class="ci-key" data-i18n="contact.location"></span>
          <span class="ci-val" data-i18n="contact.locationValue"></span>
        </div>
        <div class="contact-info-row">
          <span class="ci-key" data-i18n="contact.phone"></span>
          <a class="ci-val" href="tel:+16135550199" data-i18n="contact.phoneValue"></a>
        </div>
        <div class="contact-info-row">
          <span class="ci-key" data-i18n="contact.whatsapp"></span>
          <a class="ci-val" href="https://wa.me/16135550199" target="_blank" rel="noopener" style="color:var(--gold)">+1 (613) 555-0199</a>
        </div>
        <div class="contact-info-row">
          <span class="ci-key" data-i18n="contact.email"></span>
          <a class="ci-val" href="mailto:hello@halobraids.ca">hello@halobraids.ca</a>
        </div>
        <div class="contact-info-row">
          <span class="ci-key" data-i18n="contact.hours"></span>
          <span class="ci-val" data-i18n="contact.hoursValue" data-i18n-html></span>
        </div>
      </div>

      <!-- Social links -->
      <div style="margin-top:2rem">
        <div class="label" style="margin-bottom:.8rem" data-i18n="contact.followUs"></div>
        <div class="social-links">
          <a href="https://instagram.com/halobraids.ca" target="_blank" rel="noopener" class="social-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
            @halobraids.ca
          </a>
          <a href="https://tiktok.com/@halobraids" target="_blank" rel="noopener" class="social-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.34 6.34 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.18 8.18 0 004.77 1.52V6.75a4.85 4.85 0 01-1-.06z"/></svg>
            @halobraids
          </a>
          <a href="https://facebook.com/halobraids" target="_blank" rel="noopener" class="social-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Halo Braids
          </a>
        </div>
      </div>

      <!-- Quick book CTA -->
      <div class="contact-cta-box">
        <div style="font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.2em;margin-bottom:.6rem;color:var(--gold)">PRÊTES EN 2 MINUTES</div>
        <a href="booking.html" class="btn btn-dark" data-i18n="nav.book"></a>
      </div>
    </div>

    <!-- Right : form -->
    <form class="form contact-form fade-up" id="contact-form">
      <div class="form-row">
        <div>
          <label data-i18n="contact.form.name"></label>
          <input type="text" id="c-name" required/>
        </div>
        <div>
          <label data-i18n="contact.form.phone"></label>
          <input type="tel" id="c-phone" placeholder="+1 (613)"/>
        </div>
      </div>
      <div>
        <label data-i18n="contact.form.email"></label>
        <input type="email" id="c-email" required/>
      </div>
      <div>
        <label data-i18n="contact.form.subject"></label>
        <select id="c-subject" class="form-select">
          <option value="" data-i18n="contact.form.subjects.booking"></option>
          <option value="info" data-i18n="contact.form.subjects.info"></option>
          <option value="group" data-i18n="contact.form.subjects.group"></option>
          <option value="other" data-i18n="contact.form.subjects.other"></option>
        </select>
      </div>
      <div>
        <label data-i18n="contact.form.message"></label>
        <textarea id="c-msg" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-dark" data-i18n="contact.form.send"></button>
    </form>

  </div>
</section>

<!-- GOOGLE MAP -->
<section class="section section-dark" style="padding:0;overflow:hidden">
  <div style="display:flex;flex-direction:column">
    <div style="text-align:center;padding:2.5rem 2rem 1.5rem">
      <span class="label" data-i18n="contact.mapTitle"></span>
      <div class="h-script" style="font-size:clamp(2rem,4vw,3rem);margin:.3rem 0">Ottawa · Gatineau</div>
    </div>
    <div class="map-container">
      <iframe
        src="https://www.openstreetmap.org/export/embed.html?bbox=-75.8%2C45.35%2C-75.55%2C45.50&layer=mapnik&marker=45.4215%2C-75.6972"
        style="width:100%;height:420px;border:none"
        title="Halo Braids — Ottawa & Gatineau"
        loading="lazy"
        allowfullscreen>
      </iframe>
    </div>
    <div style="text-align:center;padding:1.5rem 2rem 2.5rem">
      <a href="https://maps.google.com/?q=Ottawa,ON,Canada" target="_blank" rel="noopener" class="btn">
        Google Maps ↗
      </a>
    </div>
  </div>
</section>

<footer class="footer" id="app-footer"></footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/luxury.js"></script>
<script>
  function refreshContactSubjects() {
    const sel = document.getElementById('c-subject');
    if (!sel) return;
    const opts = sel.querySelectorAll('option[data-i18n]');
    opts.forEach(o => { o.textContent = App.t(o.getAttribute('data-i18n')); });
  }

  document.getElementById('contact-form').addEventListener('submit', e => {
    e.preventDefault();
    App.toast(App.t('contact.form.sent'), 'success');
    e.target.reset();
  });

  function onLangChange() { refreshContactSubjects(); }
  document.addEventListener('DOMContentLoaded', refreshContactSubjects);
</script>
</body>
</html>
