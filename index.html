<script>
  function renderHomeServices() {
    const grid = document.getElementById('home-services');
    grid.innerHTML = SERVICES.slice(0,3).map(s => {
      const lang = App.cap(App.lang);
      return `
      <div class="svc-card">
        <div class="svc-card-img" style="position:relative">
          <img src="${s.img||''}" alt="${s['name'+lang]}" loading="lazy"
               onerror="this.style.display='none'"
               style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"/>
          <span class="h-script" style="position:relative;z-index:1;font-size:2.2rem;color:rgba(201,169,110,.55);text-shadow:0 2px 8px rgba(0,0,0,.6)">${s['name'+lang]}</span>
        </div>
        <div class="svc-card-body">
          <h3>${s['name'+lang].toUpperCase()}</h3>
          <div class="price">${App.t('home.from')} <strong>${s.price} $</strong>${s.priceMax ? ' — '+s.priceMax+' $' : ''}</div>
          <p class="desc">${s['desc'+lang]}</p>
          <div class="duration">${s.durationMin||s.duration}–${s.duration}h · ${App.t('services.hours')}</div>
          <a href="booking.html?service=${s.id}" class="btn btn-dark btn-sm" style="margin-top:1rem;align-self:flex-start">${App.t('services.book')}</a>
        </div>
      </div>`;
    }).join('');
  }
  function renderHomePromos() {
    const grid = document.getElementById('home-promos');
    if (!grid) return;
    const lang = App.cap(App.lang);
    // Show first 4 promos
    grid.innerHTML = PROMOTIONS.slice(0,4).map(p => `
      <div class="pt-card fade-up">
        <div class="pt-badge">${p['badge'+lang]}</div>
        <div style="font-size:1.8rem;margin-bottom:.6rem">${p.emoji}</div>
        <div class="pt-name">${p['name'+lang].toUpperCase()}</div>
        <div class="pt-desc">${p['desc'+lang]}</div>
        <div style="font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.15em;color:var(--gold);margin-top:.8rem">${p['expiry'+lang]}</div>
      </div>`).join('');
  }

  function renderHomeEvents() {
    const grid = document.getElementById('home-events');
    if (!grid) return;
    const lang = App.cap(App.lang);
    const today = new Date(); today.setHours(0,0,0,0);
    const upcoming = EVENTS.filter(ev => new Date(ev.endDate) >= today)
      .sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0,4);
    if (!upcoming.length) {
      grid.innerHTML = `<p style="color:rgba(255,255,255,.4);font-family:'Cormorant Garamond',serif;text-align:center;grid-column:1/-1" data-i18n="events.noEvents">${App.t('events.noEvents')}</p>`;
      return;
    }
    grid.innerHTML = upcoming.map(ev => {
      const d = new Date(ev.date);
      const isToday = d.getTime() === today.getTime();
      const monthShort = App.t('monthShort.' + d.getMonth());
      const tagColors = { PROMO:'#c9a96e', FERMÉ:'#e07b54', FERME:'#e07b54', OUVERT:'#4caf50', RAPPEL:'#7c9ac9' };
      const tc = tagColors[ev.tag] || '#c9a96e';
      return `
        <div class="event-card">
          <span class="event-tag" style="background:${tc}20;color:${tc}">${isToday ? App.t('events.today') : ev.tag}</span>
          <div class="event-date">${d.getDate()} ${monthShort} ${d.getFullYear()}</div>
          <div class="event-name">${ev['name'+App.cap(App.lang)]}</div>
          <div class="event-desc">${ev['desc'+App.cap(App.lang)]}</div>
        </div>`;
    }).join('');
  }

  function renderAnnouncement() {
    const bar = document.getElementById('announce-bar');
    const txt = document.getElementById('announce-text');
    if (!bar || !txt) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const dismissed = sessionStorage.getItem('hb_announce_dismissed');
    const next = EVENTS.find(ev =>
      new Date(ev.date) >= today &&
      ev.tag !== 'FERMÉ' && ev.tag !== 'FERME'
    );
    if (next && !dismissed) {
      const d = new Date(next.date);
      const monthShort = App.t('monthShort.' + d.getMonth());
      txt.textContent = `${next['name'+App.cap(App.lang)]} · ${d.getDate()} ${monthShort} — ${next['desc'+App.cap(App.lang)]}`;
      bar.style.display = 'flex';
      bar.querySelector('.announce-close').onclick = () => {
        bar.style.display = 'none';
        sessionStorage.setItem('hb_announce_dismissed', '1');
      };
    }
  }

  const INSTA_IMGS = [
    { src:'https://images.pexels.com/photos/14911898/pexels-photo-14911898.jpeg?auto=compress&cs=tinysrgb&w=500', label:'Knotless Braids' },
    { src:'https://images.pexels.com/photos/7755207/pexels-photo-7755207.jpeg?auto=compress&cs=tinysrgb&w=500',  label:'Boho Braids' },
    { src:'https://images.pexels.com/photos/7755214/pexels-photo-7755214.jpeg?auto=compress&cs=tinysrgb&w=500',  label:'Fulani Braids' },
    { src:'https://images.pexels.com/photos/9554545/pexels-photo-9554545.jpeg?auto=compress&cs=tinysrgb&w=500',  label:'Passion Twists' },
    { src:'https://images.pexels.com/photos/7755222/pexels-photo-7755222.jpeg?auto=compress&cs=tinysrgb&w=500',  label:'Goddess Locs' },
    { src:'https://images.pexels.com/photos/6858591/pexels-photo-6858591.jpeg?auto=compress&cs=tinysrgb&w=500',  label:'Cornrows' },
  ];

  function renderInstaGrid() {
    const g = document.getElementById('insta-grid');
    if (!g) return;
    g.innerHTML = INSTA_IMGS.map((im,i) => `
      <a href="https://instagram.com/halobraids.ca" target="_blank" rel="noopener"
         class="gallery-item fade-up" style="aspect-ratio:1/1;display:block"
         aria-label="${im.label}">
        <div class="ph" style="width:100%;height:100%;background:linear-gradient(135deg,#3a1e08,#0c0804)"></div>
        <img src="${im.src}" alt="${im.label}" loading="lazy"
             onerror="this.style.display='none'"
             style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s"/>
        <div class="tag" style="position:absolute;bottom:.7rem;left:.7rem;right:.7rem;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.15em;color:var(--gold);text-align:center;opacity:0;transition:.3s;text-shadow:0 1px 4px rgba(0,0,0,.8)">${im.label}</div>
      </a>`).join('');
    g.querySelectorAll('.gallery-item').forEach(el => {
      el.addEventListener('mouseenter', () => el.querySelector('.tag').style.opacity='1');
      el.addEventListener('mouseleave', () => el.querySelector('.tag').style.opacity='0');
    });
  }

  function onLangChange() { renderHomeServices(); renderHomePromos(); renderHomeEvents(); }
  document.addEventListener('DOMContentLoaded', () => {
    renderHomeServices();
    renderHomePromos();
    renderHomeEvents();
    renderAnnouncement();
    renderInstaGrid();
  });
</script>
