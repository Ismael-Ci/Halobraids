<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Services & Pricing — Halo Braids</title>
  <meta name="description" content="Knotless braids, Boho braids, Fulani braids, Passion Twists, Goddess Locs, Cornrows. Tarifs et réservation en ligne — Halo Braids Ottawa."/>
  <meta name="theme-color" content="#0c0806"/>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Cinzel:wght@400;500;600&family=Great+Vibes&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body data-page="services">

<nav class="nav solid" id="app-nav"></nav>

<section class="banner">
  <div class="banner-bg"></div>
  <div class="banner-content">
    <h1 data-i18n="services.banner"></h1>
    <div class="h-script" data-i18n="services.subtitle"></div>
  </div>
</section>

<section class="section section-light">
  <div class="grid-3" id="services-grid"></div>

  <!-- PRICE CALCULATOR -->
  <div class="calc-section fade-up" style="max-width:820px;margin:4rem auto 0">
    <div class="section-header" style="text-align:center;margin-bottom:2rem">
      <span class="label" data-i18n="calc.title"></span>
      <p style="font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--muted);margin-top:.5rem" data-i18n="calc.subtitle"></p>
    </div>

    <div class="calc-box">
      <div class="calc-group">
        <div class="calc-label" data-i18n="calc.lengthLabel"></div>
        <div class="calc-opts" id="calc-length">
          <button class="calc-opt active" data-val="1.0" data-key="short">
            <span class="calc-opt-name" data-i18n="calc.short"></span>
            <span class="calc-opt-desc" data-i18n="calc.shortDesc"></span>
          </button>
          <button class="calc-opt" data-val="1.15" data-key="medium">
            <span class="calc-opt-name" data-i18n="calc.medium"></span>
            <span class="calc-opt-desc" data-i18n="calc.mediumDesc"></span>
          </button>
          <button class="calc-opt" data-val="1.3" data-key="long">
            <span class="calc-opt-name" data-i18n="calc.long"></span>
            <span class="calc-opt-desc" data-i18n="calc.longDesc"></span>
          </button>
          <button class="calc-opt" data-val="1.5" data-key="xl">
            <span class="calc-opt-name" data-i18n="calc.xl"></span>
            <span class="calc-opt-desc" data-i18n="calc.xlDesc"></span>
          </button>
        </div>
      </div>

      <div class="calc-group">
        <div class="calc-label" data-i18n="calc.densityLabel"></div>
        <div class="calc-opts" id="calc-density">
          <button class="calc-opt active" data-val="0.9" data-key="light">
            <span class="calc-opt-name" data-i18n="calc.light"></span>
          </button>
          <button class="calc-opt active-default" data-val="1.0" data-key="normal">
            <span class="calc-opt-name" data-i18n="calc.normal"></span>
          </button>
          <button class="calc-opt" data-val="1.2" data-key="full">
            <span class="calc-opt-name" data-i18n="calc.full"></span>
          </button>
        </div>
      </div>

      <div class="calc-results" id="calc-results"></div>
      <p class="calc-note" data-i18n="calc.note"></p>
    </div>
  </div>

  <div class="card mt-3" style="max-width:760px;margin:3rem auto 0;background:var(--cream2);border-top:2px solid var(--gold)">
    <h3 class="label" data-i18n="services.policy.title"></h3>
    <div style="margin-top:1rem">
      <p style="margin:.5rem 0;font-family:'Cormorant Garamond',serif" data-i18n="services.policy.1">·</p>
      <p style="margin:.5rem 0;font-family:'Cormorant Garamond',serif" data-i18n="services.policy.2">·</p>
      <p style="margin:.5rem 0;font-family:'Cormorant Garamond',serif" data-i18n="services.policy.3">·</p>
      <p style="margin:.5rem 0;font-family:'Cormorant Garamond',serif" data-i18n="services.policy.4">·</p>
    </div>
  </div>
</section>

<footer class="footer" id="app-footer"></footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/luxury.js"></script>
<script>
  function renderServices() {
    const grid = document.getElementById('services-grid');
    grid.innerHTML = SERVICES.map(s => {
      const lang = App.cap(App.lang);
      const includes = (s['includes'+lang] || []).map(i =>
        `<li style="display:flex;align-items:center;gap:.5rem"><span style="color:var(--gold);font-size:.7rem">✦</span>${i}</li>`
      ).join('');
      return `
      <div class="svc-card">
        <div class="svc-card-img" style="position:relative">
          <img src="${s.img || ''}" alt="${s['name'+lang]}"
               loading="lazy"
               onerror="this.style.display='none'"
               style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"/>
          <span class="h-script" style="position:relative;z-index:1;font-size:2.5rem;color:rgba(201,169,110,.55);text-shadow:0 2px 8px rgba(0,0,0,.6)">${s['name'+lang]}</span>
        </div>
        <div class="svc-card-body">
          <h3>${s['name'+lang].toUpperCase()}</h3>
          <div class="price" style="display:flex;align-items:baseline;gap:.4rem">
            <span style="font-size:.65rem;font-family:'Cinzel',serif;letter-spacing:.1em;color:var(--muted)">${App.t('services.from')}</span>
            <strong>${s.price} $</strong>
            <span style="color:var(--muted);font-size:.9rem">— ${s.priceMax || s.price} $</span>
          </div>
          <p class="desc">${s['desc'+lang]}</p>
          <div class="duration">${App.t('services.duration')} · ${s.durationMin || s.duration}–${s.duration}h</div>
          <div style="margin-top:1rem;margin-bottom:.5rem">
            <div style="font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.22em;color:var(--gold-dark);margin-bottom:.5rem">${App.t('services.includes')}</div>
            <ul style="list-style:none;padding:0;margin:0;font-family:'Cormorant Garamond',serif;font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:.25rem">
              ${includes}
            </ul>
          </div>
          <a href="booking.html?service=${s.id}" class="btn btn-dark btn-sm" style="margin-top:1rem;align-self:flex-start">${App.t('services.book')}</a>
        </div>
      </div>`;
    }).join('');
  }
  // ── Price calculator ──
  let calcLength = 1.0, calcDensity = 1.0;

  function renderCalcResults() {
    const res = document.getElementById('calc-results');
    const lang = App.cap(App.lang);
    res.innerHTML = `
      <div class="calc-result-label">${App.t('calc.result')}</div>
      <div class="calc-result-grid">
        ${SERVICES.map(s => {
          const lo  = Math.round(s.price    * calcLength * calcDensity / 5) * 5;
          const hi  = Math.round(s.priceMax * calcLength * calcDensity / 5) * 5;
          return `
            <div class="calc-result-item">
              <span class="cr-name">${s['name'+lang]}</span>
              <span class="cr-price">${lo} $ — ${hi} $</span>
            </div>`;
        }).join('')}
      </div>`;
  }

  function initCalc() {
    ['calc-length','calc-density'].forEach(groupId => {
      const group = document.getElementById(groupId);
      if (!group) return;
      // Default density = normal (index 1)
      if (groupId === 'calc-density') {
        group.querySelectorAll('.calc-opt').forEach((btn, i) => {
          btn.classList.toggle('active', i === 1);
        });
        calcDensity = 1.0;
      }
      group.addEventListener('click', e => {
        const btn = e.target.closest('.calc-opt');
        if (!btn) return;
        group.querySelectorAll('.calc-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const val = parseFloat(btn.dataset.val);
        if (groupId === 'calc-length')  calcLength  = val;
        if (groupId === 'calc-density') calcDensity = val;
        renderCalcResults();
      });
    });
    renderCalcResults();
  }

  function onLangChange() { renderServices(); renderCalcResults(); }
  document.addEventListener('DOMContentLoaded', () => { renderServices(); initCalc(); });
</script>
</body>
</html>
